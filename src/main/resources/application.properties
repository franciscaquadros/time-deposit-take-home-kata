spring.application.name=time-deposit
server.port=8000

# Disposable local database. Use the postgres profile for an external database.
spring.datasource.url=jdbc:h2:mem:time-deposit-db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Flyway owns the schema; Hibernate checks that entity mappings agree with it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
